mode = "dark"

# Sampled from the live cyberpunk.net home stylesheet (home12, 2026-10-30):
#   body #000, type #fff / #cbcbcb, brand yellow #fcee0a, header wash #fbff31,
#   deeper yellow #f2e900, frame cyan #00f0ff, mute #4c4c4c,
#   alert #fe1038, hot orange #ff6000.
# Green, blue, and magenta are terminal splits of those hues so diffs stay readable.
# The site face is commercial Blender Pro. This theme does not ship that file.

